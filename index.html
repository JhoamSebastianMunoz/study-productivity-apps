<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <header>
      <h1>Diario de Estudio</h1>
      <p>Registra tus sesiones y mantén tu racha.</p>
      <div class="heatmap-controles" id="heatmap-controles">
        <label for="heatmap-weeks-select">Semanas:</label>
        <select id="heatmap-weeks-select" name="heatmap-weeks-select">
          <option value="4">4</option>
          <option value="12" selected>12</option>
          <option value="26">26</option>
          <option value="52">52</option>
        </select>
        <input type="number" id="heatmap-weeks-input" name="heatmap-weeks-input" min="1" max="52" placeholder="Semanas" aria-label="Número de semanas personalizado">
      </div>
    </header>

    <section class="racha">
      <p class="racha-numero" id="racha-numero">0</p>
      <p class="racha-texto" id="racha-texto">días seguidos estudiando</p>
      <div class="racha-estadisticas">
        <p class="mejor-racha" id="mejor-racha" hidden>🏆 Mejor racha: 0 días</p>
        <p class="minutos-semana" id="minutos-semana" hidden>Esta semana: 0 min</p>
        <p class="dias-mes" id="dias-mes" hidden>Este mes: 0 días</p>
      </div>
    </section>

    <section>
      <h2>Nueva sesión</h2>
      <form id="form-sesion" class="form-sesion">
        <div class="form-grupo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>
        <div class="form-grupo">
          <label for="tema">Tema</label>
          <input type="text" id="tema" name="tema" placeholder="Por ejemplo: Matemáticas" required>
        </div>
        <div class="form-grupo">
          <label for="minutos">Minutos</label>
          <input type="number" id="minutos" name="minutos" min="1" step="1" placeholder="Por ejemplo: 30" required>
        </div>
        <button type="submit" class="btn-guardar">Guardar sesión</button>
        <p class="error" id="mensaje-error"></p>
      </form>
    </section>

    <section class="sesiones">
      <h2>Mis sesiones</h2>
      <p id="mensaje-vacio">Todavía no tienes sesiones. Registra la primera arriba.</p>
      <ul id="lista-sesiones"></ul>
    </section>

    <section id="heatmap" aria-label="Mapa de calor de actividad de estudio"></section>
  </main>

  <script src="heatmap-logic.js"></script>
  <script src="app.js"></script>
</body>
</html>
